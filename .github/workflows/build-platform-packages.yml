name: Build platform packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Import Developer ID certificate
        shell: zsh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            print -u2 "The macOS Developer ID certificate secrets are missing."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/pycubsim2-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/pycubsim2-developer-id.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          print "PYCUBSIM2_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        shell: zsh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            print -u2 "The Apple notarization secrets are missing."
            exit 1
          fi
          xcrun notarytool store-credentials "pycubsim2-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, and notarize DMG
        env:
          PYTHON: python
          DISTRIBUTION: "1"
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: pycubsim2-notary
        run: ./tools/build_macos_dmg.zsh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: PyCubSim2-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Delete temporary signing keychain
        if: always()
        shell: zsh
        run: |
          if [[ -n "${PYCUBSIM2_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PYCUBSIM2_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/pycubsim2-developer-id.p12"

  ubuntu:
    name: Ubuntu 22.04 x64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            file \
            libfontconfig1 \
            libfuse2 \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libx11-6 \
            libxcb1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            xauth \
            xvfb

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Build AppImage and deb
        env:
          PYTHON: python
        run: ./tools/build_ubuntu_packages.sh

      - name: Inspect deb metadata
        run: dpkg-deb --info dist/*.deb

      - name: Upload Ubuntu packages
        uses: actions/upload-artifact@v7
        with:
          name: PyCubSim2-Ubuntu-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*ubuntu*.tar.gz
            dist/*ubuntu*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $known = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($known | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./tools/build_windows.ps1 -Python python -TestInstaller

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: PyCubSim2-Windows-x64
          path: |
            dist/*windows*x64-setup.exe
            dist/*windows*x64.zip
            dist/*windows*x64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
